<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Digital Tracker</title>
    <meta name="description" content="Habit Digital Tracker" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="digital">
    <div class="page">
      <header class="site-header">
        <div class="logo">Habit</div>
        <nav class="nav">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/stack.html">Stack</a>
          <a class="nav-link" href="/tracker.html">Print</a>
          <a class="nav-link" href="/digital.html">Digital</a>
          <a class="nav-link" href="/legacy.html">Legacy</a>
        </nav>
      </header>

      <main class="container">
        <div class="page-title">
          <p class="eyebrow">Digital Tracker</p>
          <h1>Digital Tracker</h1>
          <p class="digital-meta" id="todayMeta">
            Hoje · <span id="todayLabel">--/--</span>
          </p>
          <p class="digital-summary" id="progressSummary">Você já fez 0 de 0 hábitos.</p>
          <p class="muted">Um toque para fechar o dia.</p>
        </div>

        <section class="card digital-progress">
          <div class="section-title">
            <h2>Progresso de hoje</h2>
            <p class="progress-text"><strong><span id="doneCount">0</span> de <span id="totalCount">0</span> hábitos concluídos</strong></p>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </section>

        <section class="card">
          <div class="section-title">
            <h2>Hoje</h2>
            <p>Marque os hábitos do dia com um toque.</p>
          </div>
          <div class="digital-list" id="habitList"></div>
          <p class="digital-complete" id="dayComplete" hidden>
            Dia concluído. Bom descanso.
          </p>
          <p class="status-message" id="status" role="status" aria-live="polite"></p>
        </section>
      </main>

      <footer class="site-footer">
        <span>
          Habit - Por
          <a href="https://igormmatos.com.br" rel="noopener">Igor Matos</a>
        </span>
        <span>© <span data-year></span></span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
